# Scans the hash-pinned lockfile for known vulnerabilities. Fails the build if any are found.
# Actions are pinned by commit SHA, not a mutable tag, so a compromised upstream tag can't
# silently change what runs here; bump the SHA (and the version comment) deliberately to update.
name: Dependency audit

on:
  workflow_dispatch:
  pull_request:
    paths: [pyproject.toml, uv.lock]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv export --frozen --group platform --no-emit-project --format requirements-txt -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
