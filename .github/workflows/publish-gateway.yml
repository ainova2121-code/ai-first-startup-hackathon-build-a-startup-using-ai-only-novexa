# Builds the gateway image once, here, in CI — never on a customer's own machine — pushes it to
# GHCR, and signs it keylessly with Cosign (Sigstore) using this run's own GitHub OIDC identity:
# no long-lived signing key to generate, store or leak. Customers deploy by the digest this run
# prints, never the mutable tag, and verify it with the `cosign verify` command documented in
# Dockerfile.gateway's own header before they ever run it.
#
# Actions are pinned by commit SHA, not a mutable tag, matching every other workflow here.
name: Publish gateway image

on:
  workflow_dispatch:
  push:
    tags: ["gateway-v*"]

permissions:
  contents: read
  packages: write
  id-token: write  # exchanged for a short-lived Fulcio certificate by cosign's keyless signing

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/purpleteam-gateway

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
      - name: Sign the pushed image by its digest, never the mutable tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - run: |
          echo "Published and signed \`${IMAGE}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
